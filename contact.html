<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Walmart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Walmart</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">
                Home
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact Us</a>
            </li>
          </ul>

          <!-- Search Bar -->
          <form class="d-flex">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />

            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <section class="container my-5">
      <h1 class="text-center mb-4">Contact Us</h1>
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          <p class="text-center">Have a question? Send us a message!</p>
          <form>
            <div class="mb-3">
              <label for="name" class="form-label"> Full Name </label>
              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="Enter your name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label"> Email Address </label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label"> Your Message </label>
              <textarea
                class="form-control"
                id="message"
                rows="4"
                placeholder="Type your message here"
                required
              ></textarea>
            </div>
            <button type="button" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </section>

    <br />
    <footer id="contact" class="bg-dark text-white text-center py-4 mt-5">
      <div class="container">
        <h4>Walmart</h4>
        <p>Your one-stop shop for everything.</p>

        <h5 id="about">About Us</h5>
        <p>We provide quality products at affordable prices.</p>

        <h5>Connect with Us</h5>
        <p>
          <a
            href="https://www.instagram.com/walmart/"
            class="text-white me-3"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
          <a
            href="https://www.facebook.com/walmart"
            class="text-white me-3"
            target="_blank"
            rel="noopener noreferrer"
            >Facebook</a
          >
          <a
            href="https://www.linkedin.com/company/walmart/"
            class="text-white me-3"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
        </p>
        <hr />
        <p class="mb-0">&copy; 2026 Walmart Demo Website. Project 1</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
